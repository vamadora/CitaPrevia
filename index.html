<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Reserva por zona</title>
</head>
<body>

<h2>Selecciona tu calle</h2>

<select id="calle">
  <option value="">Cargando calles...</option>
</select>
<p id="status" style="color: red; font-style: italic;"></p>

<script>
  const zonaURL = {
    "sur": "https://outlook.office.com/book/CitaPreviaServiciosSocialesSIVO@sanfernando.es/s/MUR6bcYg_ke4YWv2Bd_BAQ2?ismsaljsauthenabled",
    "centro": "https://outlook.office.com/book/CitaPreviaServiciosSocialesSIVO@sanfernando.es/s/bRvOgLQp00apBdVAHwB9_Q2?ismsaljsauthenabled",
    "norte": "https://outlook.office.com/book/CitaPreviaServiciosSocialesSIVO@sanfernando.es/s/KUfhqj3TWUmgXOItAOhpSA2?ismsaljsauthenabled"
  };

  const status = document.getElementById("status");

  // 🔹 Cargar el TXT
  fetch("callejero.txt")
    .then(response => {
      if (!response.ok) {
        throw new Error(`HTTP ${response.status}`);
      }
      return response.text();
    })
    .then(data => {
      const lineas = data.split("\n");
      const callesZona = {};
      const select = document.getElementById("calle");

      // Limpiar dropdown
      select.innerHTML = '<option value="">-- Elige tu calle --</option>';
      status.textContent = "";

      // Saltar cabecera
      for (let i = 1; i < lineas.length; i++) {
        const partes = lineas[i].trim().split(/\s*\t\s*|;/);

        if (partes.length >= 4) {
          const nombre = partes[0].trim();
          const zona = partes[3].trim().toLowerCase();

          if (!nombre) continue;
          callesZona[nombre] = zona;

          // Añadir option al dropdown
          const option = document.createElement("option");
          option.value = nombre;
          option.textContent = nombre;
          select.appendChild(option);
        }
      }

      if (select.options.length <= 1) {
        status.textContent = "No se han encontrado calles en callejero.txt.";
      }

      // Evento selección
      select.addEventListener("change", function() {
        const calle = this.value;
        const zona = callesZona[calle];

        if (zona && zonaURL[zona]) {
          window.location.href = zonaURL[zona];
        }
      });

    })
    .catch(error => {
      console.error("Error cargando calles:", error);
      status.textContent = "No se han cargado las calles. Abre esta página con un servidor local (por ejemplo Live Server) para poder leer callejero.txt.";
    });
</script>

</body>
</html>
